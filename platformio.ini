; PlatformIO Project Configuration File
;
; ESP32-S3 Barcode Scanner
; Board: Waveshare ESP32-S3-Touch-LCD-2 (N16R8: 16MB QIO Flash + 8MB OPI PSRAM)
; Framework: Arduino
;
; NOTE: Flash is 16MB QIO @ 80MHz. PSRAM is 8MB Octal (OPI), enabled via
; board_build.arduino.memory_type = qio_opi below.
; https://docs.platformio.org/page/projectconf.html
;
; Boards / envs:
;   esp32s3  Waveshare ESP32-S3-Touch-LCD-2 (camera scan)      — default
;   lcd28    Waveshare ESP32-S3-LCD-2.8 (QL3301L UART scan)    — pio run -e lcd28

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.mcu = esp32s3
; Waveshare ESP32-S3-Touch-LCD-2 is N16R8: 16MB QIO flash + 8MB Octal (OPI) PSRAM.
; qio_opi = QIO flash + OPI PSRAM. Without this, heap_caps_malloc(MALLOC_CAP_SPIRAM)
; returns NULL and all large buffers (LVGL, quirc, viewfinder) fall back to the
; ~320KB internal DRAM and fail. Matches the official demo's CONFIG_SPIRAM_MODE_OCT.
board_build.arduino.memory_type = qio_opi

lib_deps = 
    lvgl/lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.12
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1
    knolleary/PubSubClient@^2.8
    https://github.com/espressif/esp32-camera.git
    https://github.com/mmMicky/TouchLib.git
    h2zero/NimBLE-Arduino@^2.2.3

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -D CAMERA_MODEL_CUSTOM
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240
    -DCONFIG_ESPTOOLPY_FLASH_SAMPLE_MODE_STR=1
    -I.
    -Isrc
    -Isrc/config

monitor_filters = esp32_exception_decoder

; Waveshare ESP32-S3-LCD-2.8 (ESP32-S3R8: 16MB flash + 8MB OPI PSRAM, same
; memory config as above). No camera and no touch: scanning comes from an
; external QL3301L module over UART (src/input/qr_scanner.cpp). Pins and
; capability flags are selected by BOARD_LCD28 in src/config/pinout.h.
[env:lcd28]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D BOARD_LCD28
; Camera preview, camera driver, image decoders (quirc / 1D) and the CST816
; touch driver are not built for this board.
build_src_filter =
    +<*>
    -<camera/>
    -<scan_preview.cpp>
    -<decoder/>
    -<input/touch.cpp>

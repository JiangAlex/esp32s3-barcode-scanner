; PlatformIO Project Configuration File
;
; ESP32-S3 Barcode Scanner
; Board: Waveshare ESP32-S3-Touch-LCD-2 (ESP32-S3R8, 8MB Flash)
; Framework: Arduino
;
; NOTE: Flash is DOUT mode (not Octal). PSRAM is 8MB Octal but handled at runtime.
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.mcu = esp32s3
; Waveshare ESP32-S3-Touch-LCD-2 is N16R8: 16MB QIO flash + 8MB Octal (OPI) PSRAM.
; qio_opi = QIO flash + OPI PSRAM. Without this, heap_caps_malloc(MALLOC_CAP_SPIRAM)
; returns NULL and all large buffers (LVGL, quirc, viewfinder) fall back to the
; ~320KB internal DRAM and fail. Matches the official demo's CONFIG_SPIRAM_MODE_OCT.
board_build.arduino.memory_type = qio_opi

lib_deps = 
    lvgl/lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.12
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1
    knolleary/PubSubClient@^2.8
    https://github.com/espressif/esp32-camera.git
    https://github.com/mmMicky/TouchLib.git

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -D CAMERA_MODEL_CUSTOM
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ=240
    -DCONFIG_ESPTOOLPY_FLASH_SAMPLE_MODE_STR=1
    -I.
    -Isrc
    -Isrc/config

monitor_filters = esp32_exception_decoder

; Standalone touch/I2C diagnostic for the Waveshare ESP32-S3-Touch-LCD-2.
; Purpose: definitively test whether the CST816D touch chip responds on the
; shared I2C bus (SDA=48/SCL=47), cross-checked against the QMI8658 IMU @0x6B
; which is known-good. Prints a full bus scan + live touch polling.
;
; Separate from main firmware. Flash, touch the screen, read serial.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

monitor_filters = esp32_exception_decoder

; Standalone ESP32-S3 candlestick K-line viewer (experiment).
; Fetches daily OHLCV JSON from the live ProTech-Stock-News API
;   GET http://blog.softsnail.com:8020/api/stock/{code}/kline?days=N
; and draws a candlestick chart (red-up/green-down) + MA5/MA20 on the 2.8" LCD
; using LVGL self-drawing. BOOT button scrolls through history.
;
; Separate from the main barcode-scanner firmware. Board/PSRAM/USB-CDC settings
; mirror the main project.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi

lib_deps =
    lvgl/lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.12
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I.
    -Isrc

monitor_filters = esp32_exception_decoder

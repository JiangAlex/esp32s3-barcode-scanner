; Standalone ANCS feasibility test (Redmine #104, step 1).
; SEPARATE from the main esp32s3-barcode-scanner firmware — nothing here touches
; the main src/. Flash this to the SAME board to validate iPhone pairing +
; notification reception before deciding on integration.
;
; Board/PSRAM/USB-CDC settings mirror the main project's platformio.ini so the
; result is valid for the Waveshare ESP32-S3-Touch-LCD-2 (N16R8).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    lvgl/lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.12

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I.
    -Isrc

monitor_filters = esp32_exception_decoder
